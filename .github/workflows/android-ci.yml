name: Android CI
on:
  pull_request:
  push:
    branches: [main, feature/android-auto-weather-20261112, perf/spatial-engine-diagnostics-20261112, fix/home-sky-gps-spatial-playback-20261112, fix/map-render-source-coherence-20261112, fix/map-particle-coverage-precip-fidelity-20261112, fix/map-gentle-tiles-efficient-viewport-20261112, fix/map-final-zoom-label-loading-20261112, fix/cloud-unification-and-weather-tile-consistency-20261112, fix/hero-precipitation-and-spatial-coverage-20261112, feature/ready-weather-tiles-smart-pipeline-20261113]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Check source and release identity
        run: node scripts/verify-import.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: project/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            project/android/**/*.gradle*
            project/android/gradle/wrapper/gradle-wrapper.properties
      - name: Use preinstalled Android SDK command-line tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Install locked JavaScript dependencies
        working-directory: project
        run: npm ci
      - name: Audit locked dependencies (direct, transitive, production)
        working-directory: project
        run: node scripts/security-audit.mjs
      - name: Verify upgraded auth and parser APIs
        working-directory: project
        run: node scripts/security-compat.mjs
      - name: Compile pinned CC0 worldwide coastline index
        working-directory: project
        run: node scripts/build-shoreline.mjs
      - name: Typecheck
        working-directory: project
        run: npm run typecheck
      - name: Unit tests
        working-directory: project
        run: |
          node --test scripts/browser-smoke-verdict.test.mjs scripts/sign-out-plan.test.mjs scripts/widget-visual-contract.test.mjs scripts/runtime-safety.test.mjs scripts/home-hero-interaction.test.mjs scripts/spatial-engine-contract.test.mjs
          node --experimental-strip-types --test src/lib/app-data/app-data.test.ts src/lib/app-data/readiness-schedule.test.ts src/lib/auth/gate-identity.test.ts src/lib/auth/sign-in-gate.test.ts src/lib/preview-path-prefix.test.ts src/weather/modelTileReadiness.test.ts src/weather/spatialRasterColor.test.ts src/weather/spatialRenderAdmission.test.ts src/weather/spatialRenderGeneration.test.ts src/weather/spatialViewportRenderer.test.ts src/weather/spatialDatasetKeys.test.ts src/weather/marineTides.test.ts src/weather/eot20TideClient.test.ts src/weather/openWatersTideClient.test.ts src/weather/coastline.test.ts src/weather/coordinateSearch.test.ts src/weather/modelFrameTimeline.test.ts src/weather/modelSourceSwitch.test.ts src/weather/windProjection.test.ts src/weather/rainRasterQuality.test.ts src/weather/rasterZoomLabels.test.ts src/weather/modelFrameQueue.test.ts src/weather/spatialTileReveal.test.ts src/weather/spatialNativeQueue.test.ts src/weather/spatialRateLimit.test.ts src/weather/maptilerPilot.test.ts src/weather/spatialRangeCache.test.ts src/weather/spatialRun.test.ts src/weather/spatialLayerTelemetry.test.ts src/weather/spatialRangeFlights.test.ts src/weather/spatialTransferMetrics.test.ts src/weather/spatialPerformance.test.ts src/weather/spatialTilePolicy.test.ts src/weather/satelliteBasemap.test.ts src/weather/spatialViewportBounds.test.ts src/weather/spatialZoomCoverage.test.ts src/weather/weatherPlayback.test.ts src/weather/modelRenderPolicy.test.ts src/weather/solarForecast.test.ts src/weather/defaultCities.test.ts src/weather/lastViewedPlace.test.ts src/weather/pinnedAlerts.test.ts src/weather/alertVisibility.test.ts src/weather/forecastQuality.test.ts src/weather/proxySecurity.test.ts src/weather/heroAtmosphere.test.ts src/weather/citySwipe.test.ts src/weather/spatialWatchdog.test.ts src/weather/qibla.test.ts src/weather/weatherApiTiles.test.ts
      - name: Verify isolated ECMWF ready-tile gateway, predictor and renderer bundle
        working-directory: project
        run: |
          node --test forecast-tiles/gateway.test.mjs forecast-tiles/metatiles.test.mjs forecast-tiles/pngIntegrity.test.mjs
          node --experimental-strip-types --test src/weather/readyTilePlan.test.ts src/weather/readyTileClient.test.ts src/weather/tinyTileDemandModel.test.ts src/weather/readyTilePilotConfig.test.ts
          npx vite build --config forecast-tiles/vite.config.ts
      # Legacy root weather tests target the replaced net.ts API (requestLane,
      # requestWeight and budget persistence). They must not run against this
      # deliberately restored 1.0.54 source. Keep them in git for reference.
      - name: Verify restored weather source contracts
        run: node scripts/verify-restored-weather.mjs
      - name: Build Capacitor web assets and sync Android
        working-directory: project
        run: npm run build:android
      - name: Prepare Gradle wrapper
        run: chmod +x project/android/gradlew
      - name: Gradle unit tests
        working-directory: project/android
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest 2>&1 | tee /tmp/myweather-gradle-test.log && exit 0
          # Retry only transient upstream download failures; never hide compilation or test failures.
          if grep -Eq 'Received status code (502|503|504)|Gateway Time-out|Connection timed out|Read timed out' /tmp/myweather-gradle-test.log; then
            echo 'Transient dependency download failure; retrying once after a short delay'
            sleep 20
            ./gradlew --no-daemon --refresh-dependencies :app:testDebugUnitTest
          else
            exit 1
          fi
      - name: Android Lint — platform security and correctness
        working-directory: project/android
        run: |
          ./gradlew --no-daemon :app:lintDebug || {
            echo "Android Lint failures:"
            REPORT="app/build/reports/lint-results-debug.txt"
            if [ -f "$REPORT" ]; then
              grep -nE 'Error:|Warning:|errors?, [0-9]+ warnings?' "$REPORT" | head -100 || true
            else
              find app/build -type f -name 'lint-results-*.txt' -print | head -15
            fi
            exit 1
          }
      # Temporary allowlist for signed device QA on specific owned branches; remove before merge.
      - name: Build and verify signed release
        if: ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') || ((github.event_name == 'pull_request' && github.event.pull_request.number == 77 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/ux-stability-no-design-20261112') || ((github.event_name == 'pull_request' && github.event.pull_request.number == 78 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/android-auto-weather-20261112') || ((github.event_name == 'push' && github.ref == 'refs/heads/feature/android-auto-weather-20261112') || ((github.event_name == 'push' && github.ref == 'refs/heads/perf/spatial-engine-diagnostics-20261112') || ((github.event_name == 'push' && github.ref == 'refs/heads/fix/home-sky-gps-spatial-playback-20261112') || ((github.event_name == 'push' && github.ref == 'refs/heads/fix/map-render-source-coherence-20261112') || ((github.event_name == 'push' && github.ref == 'refs/heads/fix/map-particle-coverage-precip-fidelity-20261112') || ((github.event_name == 'push' && github.ref == 'refs/heads/fix/map-gentle-tiles-efficient-viewport-20261112') || ((github.event_name == 'push' && github.ref == 'refs/heads/fix/map-final-zoom-label-loading-20261112') || (github.event_name == 'push' && github.ref == 'refs/heads/fix/cloud-unification-and-weather-tile-consistency-20261112')))))))))) || (github.event_name == 'push' && github.ref == 'refs/heads/fix/hero-precipitation-and-spatial-coverage-20261112') || (github.event_name == 'push' && github.ref == 'refs/heads/feature/ready-weather-tiles-smart-pipeline-20261113')
        working-directory: project/android
        env:
          KEYSTORE_BASE64: ${{ secrets.MYWEATHER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MYWEATHER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MYWEATHER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MYWEATHER_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Signing secrets missing"; exit 1
          fi
          trap 'rm -f keystore.properties release.jks' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks
          chmod 600 release.jks
          {
            printf 'storeFile=release.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties
          ./gradlew --no-daemon :app:assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/myweather-apksigner.txt
          grep -qi '3beb5ef19402c3411be1ad094a9f51fea80d3a35e5b92971b47f5f84169a0e91' /tmp/myweather-apksigner.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -1 | grep "name='net.nabdhserv.myweather' versionCode='55' versionName='1.0.0'"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          cp "$APK" app/build/outputs/apk/release/MyWeather.apk
      - uses: actions/upload-artifact@v4
        if: success() && (((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') || ((github.event_name == 'pull_request' && github.event.pull_request.number == 77 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/ux-stability-no-design-20261112') || ((github.event_name == 'pull_request' && github.event.pull_request.number == 78 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/android-auto-weather-20261112') || ((github.event_name == 'push' && github.ref == 'refs/heads/feature/android-auto-weather-20261112') || ((github.event_name == 'push' && github.ref == 'refs/heads/perf/spatial-engine-diagnostics-20261112') || ((github.event_name == 'push' && github.ref == 'refs/heads/fix/home-sky-gps-spatial-playback-20261112') || ((github.event_name == 'push' && github.ref == 'refs/heads/fix/map-render-source-coherence-20261112') || ((github.event_name == 'push' && github.ref == 'refs/heads/fix/map-particle-coverage-precip-fidelity-20261112') || ((github.event_name == 'push' && github.ref == 'refs/heads/fix/map-gentle-tiles-efficient-viewport-20261112') || ((github.event_name == 'push' && github.ref == 'refs/heads/fix/map-final-zoom-label-loading-20261112') || (github.event_name == 'push' && github.ref == 'refs/heads/fix/cloud-unification-and-weather-tile-consistency-20261112'))))))))))) || (github.event_name == 'push' && github.ref == 'refs/heads/fix/hero-precipitation-and-spatial-coverage-20261112') || (github.event_name == 'push' && github.ref == 'refs/heads/feature/ready-weather-tiles-smart-pipeline-20261113')
        with:
          name: MyWeather
          path: project/android/app/build/outputs/apk/release/MyWeather.apk
          retention-days: 7
